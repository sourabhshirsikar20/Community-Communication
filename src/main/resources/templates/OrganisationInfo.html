<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InfoTest</title>
    <link rel="stylesheet" th:href="@{/css/infostyle.css}">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="has-navbar">
    <div class="main-content">
    <div th:replace="~{NavigationBar :: public-nav}"></div>
    <div th:replace="~{fragments/street-nav :: street-nav}"></div>
<div class="grid">
    <div class="box">
        <h2>About the Organisation</h2>
        <p th:text="${Info.mainText}"></p>

        <a th:href="@{'/BlockAccess?address=' + ${Info.address}}"
           class="button-link"
           style="margin-top: 15px; display:inline-block;">
            ✏️ Edit this page
        </a>

        <div th:if="${isManager}" id = "report">
            <h3>Manager Actions</h3>
            <button onclick="reportBlock()" class="submit-button">
                🚩 Report & Remove Block
            </button>
            
            <form id="reportForm" action="/OrganisationInfo/report" method="post">
                <input type="hidden" name="id" th:value="${Info.id}">
                <input type="hidden" name="name" th:value="${Info.name}">
                <input type="hidden" id="reportReason" name="reason">
            </form>

            
        </div>
    </div>

    <div class="side">
        <div class="box">
            <h3>Visit Us</h3>
            <a th:href="'https://' + ${Info.linksText}" class="button-link">Press Here</a>
        </div>

        <div class="box">
            <h3>More Information</h3>
            <div th:text="${Info.infoText}"></div>
        </div>

        <div class="promo-box">
            <h3>Promotions Here</h3>
            <p th:text="${Info.promoText}"></p>
        </div>
    </div>
</div>
</div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:replace="~{NavigationBar :: navbar-js}"></script>
</body>
</html>
