<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add</title>
</head>
<body>
<form action="/Block/Add" method="post">
    <label>Address:</label>
    <input type="text" name="Address">
    <br>
    <label>Name:</label>
    <input type="text" name="Name">
    <br>
    <label>Roof Option:</label>
    <input type="text" name="RoofOption">
    <br>
    <label>Roof Colour:</label>
    <input type="text" name="RoofColour">
    <br>
    <label>Base Option:</label>
    <input type="text" name="BaseOption">
    <br>
    <label>Base Colour:</label>
    <input type="text" name="BaseColour">
    <br>
    <label>Foreground Option:</label>
    <input type="text" name="ForegroundOption">
    <br>
    <label>Foreground Colour:</label>
    <input type="text" name="ForegroundColour">
    <br>
    <label>Font Options:</label>
    <input type="text" name="FontOptions">
    <br>
    <label>Main Text:</label>
    <input type="text" name="MainText">
    <br>
    <label>Links Text:</label>
    <input type="text" name="LinksText">
    <br>
    <label>Info Text:</label>
    <input type="text" name="InfoText">
    <br>
    <label>Promo Text:</label>
    <input type="text" name="PromoText">
    <br>
    <button type="submit">Add</button>
</form>
<div th:if="${Str!=null}">
    <p th:text="${Str}"></p>
</div>
<a href="/Block/Check">Check</a>
<a href="/Block/View">View</a>
</body>
</html>
