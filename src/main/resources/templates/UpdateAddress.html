<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Block Address</title>
</head>
<body>
<div th:if="${Error}">
    <p th:text="${Error}"></p>
</div>
<div th:if="${NewAddress}">
    <p>Block moved successfully!</p>
    <p>New Address: <span th:text="${NewAddress}"></span></p>
</div>
<form method="post" th:action="@{/UpdateBlock/Move}">
    <label>Address:</label>
    <input type="text" name="OldAddress" th:value="${Address}" readonly>
    <label>Choose Street:</label>
    <select name="Street" required>
        <option value="">Select Street</option>
        <option th:each="Street : ${Streets}"
                th:value="${Street.address}"
                th:text="${Street.name}">
        </option>
    </select>
    <button type="submit">Move</button>
</form>
</body>
</html>
