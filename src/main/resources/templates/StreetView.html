<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Community Street View</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .street-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            padding: 40px;
            justify-content: center;
        }


        .house-block {
            position: relative;
            width: 200px; 
            height: 200px;
            transition: transform 0.2s;
            display: block;        
            text-decoration: none; 
            color: inherit;       
            cursor: pointer;       
        }

        .house-block:hover {
            transform: scale(1.05);
        }


        .house-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
        }

        .house-layer svg {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div id="header"></div>

    <div class="street-container">
        <a  class="house-block" 
            th:each="block : ${Approved}" 
            th:href="@{'/OrganisationInfo/' + ${block.id}}"
            th:data-id="${block.id}">
            
            <div class="house-layer js-inject-svg"
                 th:data-url="'/svg/base/base-' + ${block.baseOption} + '.svg'"
                 th:data-color="${block.baseColour}"
                 th:data-text="${block.name}">
            </div>

            <div class="house-layer js-inject-svg"
                 th:data-url="'/svg/roof/roof-' + ${block.roofOption} + '.svg'"
                 th:data-color="${block.roofColour}">
            </div>

            <div class="house-layer js-inject-svg"
                 th:data-url="'/svg/foreground/foreground-' + ${block.foregroundOption} + '.svg'"
                 th:data-color="${block.foregroundColour}">
            </div>

        </a>
    </div>

    <script th:src="@{/js/StreetView.js}"></script>
</body>
</html>
