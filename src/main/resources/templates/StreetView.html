<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Index</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div id="info_display"></div>
    <div class="table_wrapper">
        <table>
            <thead>
            <tr>
                <th>block</th>
                <th>roof</th>
                <th>base</th>
                <th>fore</th>
            </tr>
            </thead>
            <tbody>
                <tr th:each="block: ${Approved}">
                    <td th:text="${block.name}"></td>
                    <td th:text="${block.roofOption}"></td>
                    <td th:text="${block.baseOption}"></td>
                    <td th:text="${block.foregroundOption}"></td>
                </tr>
            </tbody>
            
        </table>
    </div>
</body>
</html>
