<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit New Block</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Font links -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wdth,wght,GRAD@0,8..144,50..150,100..900,-50..100;1,8..144,50..150,100..900,-50..100&display=swap" rel="stylesheet">
</head>
<body class="has-navbar">
  <div class="main-content">
  <div sec:authorize="!hasRole('MANAGER') and !hasRole('ADMIN')" th:replace="~{NavigationBar :: public-nav}"></div>
  <div sec:authorize="hasRole('ADMIN')" th:replace="~{NavigationBar :: admin-nav}"></div>
  <div sec:authorize="hasRole('MANAGER') and !hasRole('ADMIN')" th:replace="~{NavigationBar :: manager-nav}"></div>
  <div class="container">
    <h2 class="form-title">Submit New Block</h2>
    
    <div th:if="${successMessage}" class="success-message">
      <span th:text="${successMessage}"></span>
    </div>

    <form id="submit-block-form" action="/SubmitBlock" method="POST" th:object="${block}" novalidate>


      <!-- Block Name -->
      <div class="form-field">
        <label for="blockName">Block Name <span class="required">*</span></label>
        <input th:field="*{name}" 
               id="blockName"
               type="text" 
               maxlength="128" 
               placeholder="Enter your block name"
               onkeyup="updatePreview(); UpdateText()">
        <div class="form-error" th:errors="*{name}"></div>
        <div class="feedback"></div>
      </div>

      <!-- TEMPLATE DESIGNER SECTION -->
      <div class="template-section">
        <h3 class="section-title">Design Your Block Template</h3>
        
        <div class="template-grid">
          <!-- Left Column: Controls -->
          <div class="template-controls">
            
            <!-- Roof Layer -->
            <h4>Roof</h4>
            <div class="template-group">
              <select th:field="*{roofOption}" id="roofOption" onchange="updatePreview()" class="template-select">
                <option value="1">Template 1</option>
                <option value="2">Template 2</option>
              </select>
              
              <div class="color-input-group">
                <input type="color" th:field="*{roofColour}" id="roofColour" onchange="updatePreview()">
                <span class="color-value" id="roofColourValue" th:text="*{roofColour}"></span>
              </div>
            </div>

            <!-- Base Layer -->
            <h4>Base</h4>
            <div class="template-group">
              <select th:field="*{baseOption}" id="baseOption" onchange="updatePreview()" class="template-select">
                <option value="1">Template 1</option>
                <option value="2">Template 2</option>
              </select>
              <div class="color-input-group">
                <input type="color" th:field="*{baseColour}" id="baseColour" onchange="updatePreview()">
                <span class="color-value" id="baseColourValue" th:text="*{baseColour}"></span>
              </div>
            </div>

            <!-- Foreground Layer -->
            <h4>Foreground</h4>
            <div class="template-group">
              <select th:field="*{foregroundOption}" id="foregroundOption" onchange="updatePreview()" class="template-select">
                <option value="1">Template 1</option>
                <option value="2">Template 2</option>
              </select>
              <div class="color-input-group">
                <input type="color" th:field="*{foregroundColour}" id="foregroundColour" onchange="updatePreview()">
                <span class="color-value" id="foregroundColourValue" th:text="*{foregroundColour}"></span>
              </div>
            </div>

            <!-- Text -->
            <h4>Text Properties</h4>
            <div class="template-group" id="template-font-group">
              <label>Serif <input type="checkbox" id="fontSerif"  th:field="*{fontSerif}"  th:value="*{fontSerif}"  onchange="UpdateText()"></label>
              <label>Italic<input type="checkbox" id="fontItalic" th:field="*{fontItalic}" th:value="*{fontItalic}" onchange="UpdateText()"></label>
              <label>Weight<input type="range"    id="fontWeight" th:field="*{fontWeight}" th:value="*{fontWeight}" oninput= "UpdateText()" min="100" max="900"></label>
              <label>Width <input type="range"    id="fontWidth"  th:field="*{fontWidth}"  th:value="*{fontWidth}"  oninput= "UpdateText()" min="75" max="100"></label>
              <label>Grade <input type="range"    id="fontGrade"  th:field="*{fontGrade}"  th:value="*{fontGrade}"  oninput= "UpdateText()" min="-50" max="100"></label>
            </div>
            <div class="color-input-group">
              <input type="color" th:field="*{fontColour}" id="textColour" onchange="updatePreview(); UpdateText()">
              <span class="color-value" id="textColourValue" th:text="*{fontColour}"></span>
            </div>
          </div>

          <!-- Right Column: Preview -->
          <div class="template-preview">
            <div class="preview-container">
              <h4 class="preview-title">Live Preview</h4>
              <div class="preview-box">
                <div id="preview-base" class="preview-layer"></div>
                <div id="preview-roof" class="preview-layer"></div>
                <div id="preview-foreground" class="preview-layer"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Text -->
      <div class="form-field">
        <label for="mainText">Main Text <span class="required">*</span></label>
        <textarea th:field="*{mainText}" 
                  id="mainText"
                  rows="6"
                  placeholder="Add description here..."></textarea>
        <div class="word-count"><span id="mainTextCount">0</span>/512 words</div>
        <div class="form-error" th:errors="*{mainText}"></div>
        <div class="feedback"></div>
      </div>

      <!-- Links Text -->
      <div class="form-field">
        <label for="linksText">Links Text</label>
        <textarea th:field="*{linksText}" 
                  id="linksText"
                  rows="4"
                  placeholder="Add links here..."></textarea>
        <div class="word-count"><span id="linksTextCount">0</span>/256 words</div>
        <div class="feedback"></div>
      </div>

      <!-- Info Text -->
      <div class="form-field">
        <label for="infoText">Info Text</label>
        <textarea th:field="*{infoText}" 
                  id="infoText"
                  rows="4"
                  placeholder="Add contact information here..."></textarea>
        <div class="word-count"><span id="infoTextCount">0</span>/256 words</div>
        <div class="feedback"></div>
      </div>

      <!-- Promo Text -->
      <div class="form-field">
        <label for="promoText">Promo Text</label>
        <textarea th:field="*{promoText}" 
                  id="promoText"
                  rows="4"
                  placeholder="Add promo information here..."></textarea>
        <div class="char-count"><span id="promoTextCount">0</span>/256 words</div>
        <div class="feedback"></div>
      </div>

      <!-- Submit Button -->
      <div class="form-actions">
        <button class="submit-button" type="submit">Submit for Approval</button>
      </div>
    </form>
    </div>
  </div>
  <div th:replace="~{fragments/footer :: footer}"></div>
  <!-- JS Files -->
  <script th:replace="~{NavigationBar :: navbar-js}"></script>
  <script src="js/preview.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
