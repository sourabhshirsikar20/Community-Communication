<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Block</title>
</head>
<body>
<form action="/Block/View" method="get">
    <label>Address:</label>
    <input type="text" name="Address" th:value="${Address}">
    <button type="submit">Search</button>
</form>
<div th:if="${Block!=null}">
<h1>Block Details</h1>
<p>Name: <span th:text="${Block.name}"></span></p>
<p>Address: <span th:text="${Block.address}"></span></p>
<p>Text: <span th:text="${Block.mainText}"></span></p>
<p>Info: <span th:text="${Block.infoText}"></span></p>
</div>
<div th:if="${Block == null} and ${Address !=null}">
    <p>Not Found</p>
</div>
<a href="/Block/Check">Check</a>
</body>
</html>
