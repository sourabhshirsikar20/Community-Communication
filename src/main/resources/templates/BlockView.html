<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Block</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="has-navbar">
<div th:replace="~{NavigationBar :: admin-nav}"></div>

<h2 class="form-title">View Block</h2>
<form action="/Block/View" method="get" onsubmit="CheckNull(event)" class="form view-form">
    <div class="form-group">
        <label>Address:</label>
        <input type="text" id="Address" name="Address" th:value="${Address}" class="form-input">
    </div>
    <button type="submit" class="submit-button">Search</button>
</form>

<div th:if="${Block!=null}" class="block-details">
    <h3>Block Details</h3>
    <p>Name: <span th:text="${Block.name}"></span></p>
    <p>Address: <span th:text="${Block.address}"></span></p>
    <p>Text: <span th:text="${Block.mainText}"></span></p>
    <p>Info: <span th:text="${Block.infoText}"></span></p>
</div>

<div th:if="${Address!=null and Address != ''}" class="check-result">
    <div th:if="${Exists}" class="success-message">
        <span>Yes, In DB</span>
        <a th:href="@{'/Block/Update/' + ${Address}}">Can Update Here</a>
        <a th:href="@{'/UpdateBlock?Address=' + ${Address}}">Move Streets</a>
    </div>
    <div th:if="${!Exists}" class="error-message">
        <span>Not, In DB</span>
        <a href="/Block/Add">Can Add Here</a>
    </div>
</div>

<span id="CheckNull" class="error-message" hidden>Address Can't Be Null</span>

<script>
    function CheckNull(event){
        const Addr = document.getElementById("Address");
        const ErrMsg = document.getElementById("CheckNull");
        ErrMsg.hidden = true;
        if(Addr.value.trim() === ""){
            event.preventDefault();
            ErrMsg.hidden = false;
        }
    }
</script>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:replace="~{NavigationBar :: navbar-js}"></script>
</body>
</html>
