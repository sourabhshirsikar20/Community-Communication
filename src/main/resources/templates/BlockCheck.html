<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check</title>
</head>
<body>
<form action="/Block/Check" method="get" onsubmit="CheckNull(event)">
    <label>Enter Address:</label>
    <input type="text" id="Address" name="Address">
    <button type="submit">Check</button>
</form>
<div th:if="${Address!=null}">
    <div th:if="${Exists}">
        <span>Yes, In DB</span>
        <a th:href="@{'/Block/Update/' + ${Address}}">Can Update Here</a>
    </div>
    <div th:if="${!Exists}">
        <span>Not, In DB</span>
        <a href="/Block/Add">Can Add Here</a>
    </div>
</div>
<span id="CheckNull" hidden>Address Can't Be Null</span>
<script>
    function CheckNull(event){
    const Addr = document.getElementById("Address");
    const ErrMsg = document.getElementById("CheckNull");
    ErrMsg.hidden = true;
    if(Addr.value.trim() === ""){
    event.preventDefault();
    ErrMsg.hidden = false;
    }
    }
</script>
</body>
</html>
