<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="has-navbar">
<div th:replace="~{NavigationBar :: approver-nav}"></div>

<h2 class="form-title">Check Block</h2>
<form action="/Block/Check" method="get" onsubmit="CheckNull(event)" class="form check-form">
    <div class="form-group">
        <label>Enter Address:</label>
        <input type="text" id="Address" name="Address" class="form-input">
    </div>
    <button type="submit" class="submit-button">Check</button>
</form>

<div th:if="${Address!=null}" class="check-result">
    <div th:if="${Exists}" class="success-message">
        <span>Yes, In DB</span>
        <a th:href="@{'/Block/Update/' + ${Address}}">Can Update Here</a>
        <a th:href="@{'/Block/DownloadJSON?Address=' + ${Address}}">
            Download JSON
        </a>
    </div>
    <div th:if="${!Exists}" class="error-message">
        <span>Not, In DB</span>
        <a href="/Block/Add">Can Add Here</a>
    </div>
</div>

<span id="CheckNull" class="error-message" hidden>Address Can't Be Null</span>

<script>
    function CheckNull(event){
        const Addr = document.getElementById("Address");
        const ErrMsg = document.getElementById("CheckNull");
        ErrMsg.hidden = true;
        if(Addr.value.trim() === ""){
            event.preventDefault();
            ErrMsg.hidden = false;
        }
    }
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:replace="~{NavigationBar :: navbar-js}"></script>
</body>
</html>
