<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div>
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Approve?</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry: ${entries}">

                <td><button type="button">✓</button></td>
            </tr>
            </tbody>

        </table>
    </div>
</body>
</html>
