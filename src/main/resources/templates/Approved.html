<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Unapproved Data Blocks</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="has-navbar">
    <div class="main-content">
    <div sec:authorize="hasRole('ADMIN')" th:replace="~{NavigationBar :: admin-nav}"></div>
    <div sec:authorize="hasRole('MANAGER') and !hasRole('ADMIN')" th:replace="~{NavigationBar :: manager-nav}"></div>
    <div id="info_display"></div>
    <div class="table_wrapper">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Approve?</th>
                <th>Delete?</th>
            </tr>
            </thead>
            <tbody>
                <tr th:each="entry: ${entries}">
                    <td> 
                        <span   class="entry_names" 
                                th:data-id="${entry.id}" 
                                th:text="${entry.name}">
                        </span>
                    </td>

                    <td>
                        <form method="post" th:action="@{/approveBlock}">
                    
                            <input type="hidden" name="id" th:value="${entry.id}" />
                            <button type="submit" id = "approve_button">
                                ✓
                            </button>
                        </form>
                    </td>

                    <td>
                        <form method="post" th:action="@{/deleteBlock}" 
                              onsubmit="return confirm('Are you sure you want to delete this block?');">
                            <input type="hidden" name="id" th:value="${entry.id}" />
                            <button type="submit"  id = "delete_button">
                                ✕
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
            
        </table>
    </div>
</div>
</div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:replace="~{NavigationBar :: navbar-js}"></script>
    <script th:src="@{/js/ApproverTable.js}"></script>
    <script th:inline="javascript">
        const entriesFromJava = /*[[${entries}]]*/ [];
        enableTableInteractions(entriesFromJava);
    </script>
</body>
</html>
