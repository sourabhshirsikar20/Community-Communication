<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div>
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Approve?</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry: ${entries}">
                <td> 
                    <span   class="clickable-name" 
                            style="cursor: pointer; color: blue;" 
                            th:data-id="${entry.id}" 
                            th:text="${entry.name}">
                    </span>
                </td>

                <td><button type="button">✓</button></td>
            </tr>
            </tbody>
            <div id="info-display"></div>
        </table>
    </div>
    
    <script th:src="@{/js/ApproverTable.js}"></script>
    <script th:inline="javascript">
    const entriesFromJava = /*[[${entries}]]*/ [];
    enableTableInteractions(entriesFromJava);
</script>
</body>
</html>
