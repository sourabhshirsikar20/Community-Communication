<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <form id="login-form" method="post" th:action="@{/Login}">
    <div>
      <h2>Welcome!</h2>
      <div id="logout-message" th:if="${param.logout}">You have been logged out</div>
      <div id="login-fields">
        <label> 
          <p>Enter as:</p>
          <select name="username">
            <option value="user">User</option>
            <option value="manager">Local Manager</option>
          </select>
        </label>
        <label>
          <p>Access code:</p>
          <input name="password" type="password"/>
        </label>
      </div>
      <div class="form-error" th:if="${param.error}">Invalid access code</div>
      <input type="submit" value="Enter Site"/>
    </div>
  </form>
</body>
</html>
