<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="main-content">
    <!-- LOGOUT MESSAGE - Shows at the top when user clicks logout -->
    <div th:if="${param.logout}" class="logout-success-message">
        You have been logged out successfully. Please login again.
    </div>

<form id="login-form" method="post" th:action="@{/Login}">
    <div>
        <!-- DYNAMIC HEADER - Shows appropriate message based on URL type -->
        <h2 th:if="${admin_url}">Admin access is required for this page</h2>
        <h2 th:if="${manager_url}">Manager access is required for this page</h2>
        <h2 th:unless="${manager_url or admin_url}">Welcome User</h2>
        
        <div id="login-fields">
            <label>
                <p>Enter as:</p>
                
                <!-- OPTION 1: Admin URL - Show ONLY Admin option -->
                <select name="username" th:if="${admin_url}">
                    <option value="admin">Admin</option>
                </select>
                
                <!-- OPTION 2: Manager URL - Show Manager options -->
                <select name="username" th:if="${manager_url and !admin_url}">
                    <option value="manager">Local Manager</option>
                </select>
                
                <!-- OPTION 3: User URL or Normal - Show ALL options -->
                <select name="username" th:if="${!manager_url and !admin_url}">
                    <option value="user">User</option>
                    <option value="manager">Local Manager</option>
                    <option value="admin">Admin</option>
                </select>
            </label>
            <label>
                <p>Access code:</p>
                <input name="password" type="password" autofocus/>
            </label>
        </div>
        
        <!-- ERROR MESSAGE - Shows when login fails -->
        <div class="form-error" th:if="${param.error}">Invalid access code</div>
        
        <input type="submit" value="Enter Site"/>
    </div>
</form>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- AUTO-HIDE LOGOUT MESSAGE SCRIPT -->
<script>
    // Auto-hide logout success message after 5 seconds
    setTimeout(() => {
        const logoutMsg = document.querySelector('.logout-success-message');
        if (logoutMsg) {
            logoutMsg.style.transition = "opacity 1s ease";
            logoutMsg.style.opacity = 0;
            setTimeout(() => logoutMsg.remove(), 1000);
        }
    }, 5000);
</script>
</body>
</html>
