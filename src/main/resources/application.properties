spring.application.name=community communication

spring.datasource.url=jdbc:mariadb://localhost:3306/communities
spring.datasource.username=root
spring.datasource.password=comsc
spring.sql.init.mode=always

# Show INFO level logs for Expiry package
logging.level.com.community.communication.Expiry=INFO

# Show when scheduled tasks execute
logging.level.org.springframework.scheduling=INFO

# Custom log pattern with timestamp
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Optional: Log to file
logging.file.name=logs/expiry-cleanup.log
ogging.file.max-size=10MB
logging.file.max-history=30